name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  WPNUXT_WORDPRESS_URL: ${{ secrets.WPNUXT_WORDPRESS_URL }}

jobs:
  # Lint runs independently (no dev:prepare needed)
  lint:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    name: Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  # Test and typecheck run in parallel (both need dev:prepare)
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    name: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare module
        run: pnpm run dev:prepare

      - name: Run tests
        run: pnpm run test

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    name: Type Check

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare for type checking
        run: pnpm run dev:prepare

      - name: Run type check
        run: pnpm run typecheck

  # Build only runs after all checks pass
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    name: Build
    needs: [lint, test, typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build module
        run: pnpm run build

  # E2E tests on every commit - latest WP (7.1) + Nuxt 4.4 using Docker
  e2e:
    runs-on: ubuntu-latest
    name: E2E (WP 7.1 + Nuxt 4.4)
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup WordPress and Run E2E Tests
        uses: ./.github/actions/setup-wp-e2e
        with:
          wp_version: '7.1'
          nuxt_fixture: nuxt44

  # Last step: only after every check above passed, and only on main (push or manual run).
  # Builds playgrounds/full (demo.wpnuxt.com) into an image, smoke-tests it, pushes it to the
  # self-hosted registry and triggers the Coolify redeploy.
  demo:
    runs-on: ubuntu-latest
    name: Deploy demo
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    # Secrets live in the "demo" environment, which only main may deploy to
    environment:
      name: demo
      url: https://demo.wpnuxt.com
    concurrency:
      group: demo
      cancel-in-progress: true
    env:
      IMAGE: registry.apps.vernaillen.dev/wpnuxt-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so it can be smoke-tested before pushing
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playgrounds/full/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE}:${{ github.sha }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = "1" ]; then
            curl -fsS -o /dev/null http://localhost:3000/events/ || ok=0
            # 401, not 404: the revalidate endpoint is registered
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/_wpnuxt/revalidate)" = "401" ] || ok=0
          fi
          echo "----- container logs -----"; docker logs smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::Smoke test failed"; exit 1; }

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but does not redeploy on its own. COOLIFY_DEPLOY_URL is the full
      # deploy endpoint incl. ?uuid=<resource-uuid>.
      - name: Trigger Coolify redeploy
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.COOLIFY_DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
