name: Setup WordPress and Run E2E Tests

description: Starts WordPress via Docker, installs plugins, and runs Playwright E2E tests

inputs:
  wp_version:
    description: 'WordPress version'
    required: true
    type: string
  nuxt_fixture:
    description: 'Nuxt fixture (nuxt44, nuxt47, etc.)'
    required: true
    type: string
  wpgraphql_version:
    description: 'WPGraphQL version (default: latest)'
    required: false
    default: 'latest'
    type: string
  wpgraphql_content_blocks_version:
    description: 'WPGraphQL Content Blocks version (default: latest)'
    required: false
    default: 'latest'
    type: string
  wpgraphql_headless_login_version:
    description: 'WPGraphQL Headless Login version (default: latest)'
    required: false
    default: 'latest'
    type: string

runs:
  using: composite
  steps:
    - name: Determine WordPress port
      id: wp-port
      shell: bash
      working-directory: e2e/docker
      run: |
        # Read the published port straight from the compose file so this can
        # never drift from WP_PORTS in run-tests.mjs. The old 8000 + minor
        # arithmetic silently broke for 7.x (7.0 -> 8000, not 8011).
        COMPOSE=docker-compose.wp-${{ inputs.wp_version }}.yml
        PORT=$(sed -n 's/.*"\([0-9]\{1,\}\):80"/\1/p' "$COMPOSE" | head -1)
        if [ -z "$PORT" ]; then
          echo "Could not determine WordPress port from $COMPOSE" >&2
          exit 1
        fi
        echo "Using port $PORT for WordPress ${{ inputs.wp_version }}"
        echo "port=$PORT" >> "$GITHUB_OUTPUT"

    - name: Start WordPress ${{ inputs.wp_version }}
      working-directory: e2e/docker
      shell: bash
      env:
        WPGRAPHQL_VERSION: ${{ inputs.wpgraphql_version }}
        WPGRAPHQL_CONTENT_BLOCKS_VERSION: ${{ inputs.wpgraphql_content_blocks_version }}
        WPGRAPHQL_HEADLESS_LOGIN_VERSION: ${{ inputs.wpgraphql_headless_login_version }}
      run: |
        docker compose -f docker-compose.wp-${{ inputs.wp_version }}.yml up -d mysql
        # Wait for MySQL to be healthy
        for i in {1..30}; do
          if docker compose -f docker-compose.wp-${{ inputs.wp_version }}.yml exec -T mysql mysqladmin ping -h localhost --silent; then
            echo "MySQL is ready"
            break
          fi
          echo "Waiting for MySQL..."
          sleep 2
        done
        # Start WordPress
        docker compose -f docker-compose.wp-${{ inputs.wp_version }}.yml up -d wordpress
        # Wait for WordPress to be ready
        for i in {1..60}; do
          if curl -s http://localhost:${{ steps.wp-port.outputs.port }}/ > /dev/null 2>&1; then
            echo "WordPress is ready"
            break
          fi
          echo "Waiting for WordPress..."
          sleep 3
        done

    - name: Setup WordPress
      working-directory: e2e/docker
      shell: bash
      run: docker compose -f docker-compose.wp-${{ inputs.wp_version }}.yml exec -T wordpress /setup.sh

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Prepare module
      shell: bash
      run: pnpm run dev:prepare

    - name: Install e2e dependencies
      working-directory: e2e
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

    - name: Install Playwright browsers
      working-directory: e2e
      shell: bash
      run: |
        for i in 1 2 3; do
          pnpm exec playwright install --with-deps && break
          if [ "$i" = "3" ]; then echo "playwright install failed after 3 attempts"; exit 1; fi
          echo "playwright install failed (attempt $i), retrying in 15s..."
          sleep 15
        done

    - name: Run E2E tests
      shell: bash
      working-directory: e2e
      run: node run-tests.mjs --no-docker --wp=${{ inputs.wp_version }} --nuxt=${{ inputs.nuxt_fixture }}

    - name: Stop Docker
      if: always()
      working-directory: e2e/docker
      shell: bash
      run: docker compose -f docker-compose.wp-${{ inputs.wp_version }}.yml down
